<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Manager · Ledgerly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
</head>
<body>
<script>if (!localStorage.getItem('ft_token')) window.location.href = 'login.html';</script>

<template id="tpl">
<div class="page-header">
  <div>
    <div class="page-eyebrow">Obligations</div>
    <h1 class="page-title">Loan Manager</h1>
    <p class="page-sub">Balances, amortization, and payoff timelines.</p>
  </div>
  <button class="btn btn-brass" id="openLoanBtn">+ Add Loan</button>
</div>

<div class="grid grid-3" style="margin-bottom:20px;">
  <div class="card stat-card"><div class="stat-label">Total Loans</div><div class="stat-value" id="total-loans">—</div></div>
  <div class="card stat-card"><div class="stat-label">Total Owed</div><div class="stat-value" id="total-owed">—</div></div>
  <div class="card stat-card"><div class="stat-label">Total Interest (Lifetime)</div><div class="stat-value" id="total-interest">—</div></div>
</div>

<div class="grid grid-2" style="margin-bottom:20px;">
  <div class="card chart-card"><div class="card-title">Loan Distribution</div><canvas id="loan-distribution-chart" height="160"></canvas></div>
  <div class="card chart-card"><div class="card-title">Interest vs Principal</div><canvas id="interest-principal-chart" height="160"></canvas></div>
</div>

<div class="card" style="margin-bottom:20px;">
  <div class="card-title">Your Loans</div>
  <div id="loans-list"></div>
</div>

<div class="card" style="margin-bottom:20px;">
  <div class="card-title">Compare Two Loans</div>
  <div class="grid grid-2">
    <div>
      <div class="hint" style="margin-bottom:8px; font-weight:600;">Option A</div>
      <div class="form-row"><label>Amount</label><input type="number" id="compare-amount1"></div>
      <div class="form-row"><label>Interest rate (%)</label><input type="number" id="compare-rate1" step="0.01"></div>
      <div class="form-row"><label>Term (months)</label><input type="number" id="compare-term1"></div>
    </div>
    <div>
      <div class="hint" style="margin-bottom:8px; font-weight:600;">Option B</div>
      <div class="form-row"><label>Amount</label><input type="number" id="compare-amount2"></div>
      <div class="form-row"><label>Interest rate (%)</label><input type="number" id="compare-rate2" step="0.01"></div>
      <div class="form-row"><label>Term (months)</label><input type="number" id="compare-term2"></div>
    </div>
  </div>
  <button class="btn btn-primary" id="compare-loans-btn">Compare</button>
  <div id="comparison-results" style="margin-top:16px;"></div>
</div>

<div class="card" style="margin-bottom:20px;">
  <div class="flex-between" style="margin-bottom:10px;">
    <div class="card-title" style="margin:0;">Payment Overview</div>
    <div class="tabs time-period-toggle">
      <button type="button" class="tab-btn active" data-period="monthly">Monthly</button>
      <button type="button" class="tab-btn" data-period="yearly">Yearly</button>
      <button type="button" class="tab-btn" data-period="total">Total</button>
    </div>
  </div>
  <div class="grid grid-3">
    <div class="stat-card"><div class="stat-label">Principal Remaining</div><div class="stat-value" id="principal-remaining" style="font-size:19px;">—</div></div>
    <div class="stat-card"><div class="stat-label">Interest Remaining</div><div class="stat-value" id="interest-remaining" style="font-size:19px;">—</div></div>
    <div class="stat-card"><div class="stat-label">Total Remaining</div><div class="stat-value" id="total-remaining" style="font-size:19px;">—</div></div>
  </div>
</div>

<div class="card">
  <div class="card-title">Amortization Schedule</div>
  <select id="amortizationLoanSelect" style="margin-bottom:14px; max-width:280px;"><option value="">No loan selected</option></select>
  <div class="table-wrap" style="max-height:360px; overflow-y:auto;">
    <table>
      <thead><tr><th>#</th><th>Date</th><th style="text-align:right;">Payment</th><th style="text-align:right;">Principal</th><th style="text-align:right;">Interest</th><th style="text-align:right;">Balance</th></tr></thead>
      <tbody id="amortization-table"><tr class="empty-row"><td colspan="6">No loan selected</td></tr></tbody>
    </table>
  </div>
</div>

<!-- Add Loan Modal -->
<div class="modal-overlay" id="loan-modal" hidden>
  <div class="modal">
    <div class="modal-header"><h3>Add Loan</h3><button class="modal-close" id="loanModalClose">&times;</button></div>
    <form id="loan-form">
      <div class="modal-body">
        <div class="form-row"><label for="loanName">Loan name</label><input type="text" id="loanName" required placeholder="e.g. Home Loan - HDFC"></div>
        <div class="form-grid">
          <div class="form-row"><label for="loanType">Type</label>
            <select id="loanType"><option>Home</option><option>Auto</option><option>Personal</option><option>Student</option><option>Other</option></select>
          </div>
          <div class="form-row"><label for="loanAmount">Principal amount</label><input type="number" id="loanAmount" min="1" required></div>
        </div>
        <div class="form-grid">
          <div class="form-row"><label for="loanRate">Interest rate (annual %)</label><input type="number" id="loanRate" step="0.01" min="0" required></div>
          <div class="form-row"><label for="loanTerm">Term (months)</label><input type="number" id="loanTerm" min="1" required></div>
        </div>
        <div class="form-grid">
          <div class="form-row"><label for="loanStartDate">Start date</label><input type="date" id="loanStartDate" required></div>
          <div class="form-row"><label for="loanFrequency">Payment frequency</label>
            <select id="loanFrequency"><option value="monthly">Monthly</option><option value="biweekly">Bi-weekly</option><option value="weekly">Weekly</option></select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="loanCancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Loan</button>
      </div>
    </form>
  </div>
</div>

<!-- Payment Modal -->
<div class="modal-overlay" id="payment-modal" hidden>
  <div class="modal" style="max-width:420px;">
    <div class="modal-header"><h3>Record Payment</h3><button class="modal-close" id="paymentModalClose">&times;</button></div>
    <form id="payment-form">
      <div class="modal-body">
        <div class="form-row"><label for="paymentAmount">Amount</label><input type="number" id="paymentAmount" min="0.01" step="0.01" required></div>
        <div class="form-row"><label for="paymentDate">Date</label><input type="date" id="paymentDate" required></div>
        <div class="form-row"><label for="paymentType">Type</label>
          <select id="paymentType"><option value="regular">Regular</option><option value="extra">Extra</option><option value="late">Late</option></select>
        </div>
        <div class="form-row"><label for="paymentNotes">Notes</label><input type="text" id="paymentNotes"></div>
        <div id="extraImpactPreview" class="hint" style="display:none;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="paymentCancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary">Record Payment</button>
      </div>
    </form>
  </div>
</div>
</template>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/loans.js"></script>
</body>
</html>
