<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports · Ledgerly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script>if (!localStorage.getItem('ft_token')) window.location.href = 'login.html';</script>

<template id="tpl">
<div class="page-header">
  <div>
    <div class="page-eyebrow">Reporting</div>
    <h1 class="page-title">Reports</h1>
    <p class="page-sub">Filter, review, and export a spending summary.</p>
  </div>
  <button class="btn btn-brass" id="download-report-btn">Download CSV</button>
</div>

<div class="card" style="margin-bottom:18px;">
  <div class="filters-row">
    <select id="report-category-filter">
      <option value="">All</option>
      <option value="income">Type: Income</option>
      <option value="expense">Type: Expense</option>
      <option disabled>──────────</option>
    </select>
    <input type="month" id="report-date-filter">
    <button class="btn btn-primary" id="apply-report-filter">Apply</button>
  </div>
  <p id="report-summary-text" class="muted" style="margin:0 0 14px;">Showing all transactions.</p>
  <div class="table-wrap"><table>
    <thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Type</th><th style="text-align:right;">Amount</th></tr></thead>
    <tbody id="report-table-body"></tbody>
    <tfoot><tr><td colspan="4" style="text-align:right; font-weight:600;">Total</td><td style="text-align:right;" class="mono" id="reportTotal">—</td></tr></tfoot>
  </table></div>
</div>
</template>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/categories.js"></script>
<script src="js/nav.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
