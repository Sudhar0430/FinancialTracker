<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions · Ledgerly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script>if (!localStorage.getItem('ft_token')) window.location.href = 'login.html';</script>

<template id="tpl">
<div class="page-header">
  <div>
    <div class="page-eyebrow">Ledger</div>
    <h1 class="page-title">Transactions</h1>
    <p class="page-sub">Every entry, searchable and exportable.</p>
  </div>
  <div style="display:flex; gap:10px;">
    <button class="btn btn-outline" id="exportCsvBtn">Export CSV</button>
    <button class="btn btn-brass" id="openAddBtn">+ Add Transaction</button>
  </div>
</div>

<div class="card" style="margin-bottom:18px;">
  <div class="filters-row">
    <input type="text" id="searchInput" placeholder="Search description…">
    <select class="category-filter" id="categoryFilter"><option value="">All categories</option></select>
    <input type="date" class="date-filter" id="dateFilter">
    <button class="btn btn-primary apply-filters-btn" id="applyFiltersBtn">Proceed</button>
    <button class="btn btn-ghost" id="clearFiltersBtn">Clear</button>
    <span style="flex:1"></span>
    <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-dim);">
      <input type="checkbox" id="bulkModeToggle" style="width:auto;"> Bulk select
    </label>
    <button class="btn btn-danger btn-sm" id="bulkDeleteBtn" style="display:none;">Delete selected</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th id="thCheck" style="display:none; width:30px;"></th>
          <th class="sortable" data-sort="date">Date</th>
          <th>Description</th>
          <th>Category</th>
          <th>Type</th>
          <th class="sortable" data-sort="amount" style="text-align:right;">Amount</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="txBody"></tbody>
      <tfoot>
        <tr>
          <td colspan="4" style="text-align:right; font-weight:600;">Filtered Total</td>
          <td style="text-align:right;" class="mono" id="filteredTotal">—</td>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>

<!-- Add / Edit Transaction Modal -->
<div class="modal-overlay" id="transactionModal" hidden>
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Add Transaction</h3>
      <button class="modal-close" id="closeModalBtn">&times;</button>
    </div>
    <form id="transactionForm">
      <div class="modal-body">
        <div class="tabs" style="margin-bottom:18px;">
          <button type="button" class="tab-btn expense-active active" data-type="expense">Expense</button>
          <button type="button" class="tab-btn income-active" data-type="income">Income</button>
        </div>
        <input type="hidden" id="txId">
        <div class="form-row">
          <label for="description">Description</label>
          <input type="text" id="description" required placeholder="e.g. Electricity bill">
        </div>
        <div class="form-grid">
          <div class="form-row">
            <label for="amount">Amount</label>
            <input type="number" id="amount" min="0.01" step="0.01" required placeholder="0.00">
          </div>
          <div class="form-row">
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>
        </div>
        <div class="form-row">
          <label>Category</label>
          <div class="category-grid" id="categoryGrid"></div>
          <input type="hidden" id="category" required>
        </div>
        <div id="formError" class="error-text" style="display:none;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveTxBtn">Save Transaction</button>
      </div>
    </form>
  </div>
</div>
</template>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/categories.js"></script>
<script src="js/nav.js"></script>
<script src="js/transactions.js"></script>
</body>
</html>
