<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Advisor · Ledgerly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script>if (!localStorage.getItem('ft_token')) window.location.href = 'login.html';</script>

<template id="tpl">
<div class="page-header">
  <div>
    <div class="page-eyebrow">Markets</div>
    <h1 class="page-title">AI Advisor</h1>
    <p class="page-sub">A quick read on your finances, generated from your real data.</p>
  </div>
  <button class="btn btn-brass" id="refreshBtn">↻ Refresh Insights</button>
</div>

<div class="card" style="margin-bottom:18px;">
  <div class="card-title">Summary</div>
  <p id="ai-summary" class="loading-text">Loading…</p>
</div>

<div class="grid grid-2" style="margin-bottom:18px;">
  <div class="card">
    <div class="card-title">Insights</div>
    <ul id="ai-insights" style="margin:0; padding-left:18px; line-height:1.9;"><li class="loading-text">Analyzing…</li></ul>
  </div>
  <div class="card">
    <div class="card-title">Advice</div>
    <p id="ai-advice-text" class="loading-text">Thinking…</p>
  </div>
</div>

<div class="card">
  <div class="flex-between" style="margin-bottom:10px;">
    <div class="card-title" style="margin:0;">History</div>
  </div>
  <div id="ai-history" class="faint" style="font-size:13px;">No previous insights yet.</div>
</div>
</template>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/ai-advisor.js"></script>
</body>
</html>
