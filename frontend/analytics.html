<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics · Ledgerly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
</head>
<body>
<script>if (!localStorage.getItem('ft_token')) window.location.href = 'login.html';</script>

<template id="tpl">
<div class="page-header">
  <div>
    <div class="page-eyebrow">Reporting</div>
    <h1 class="page-title">Analytics</h1>
    <p class="page-sub">The full year, at a glance.</p>
  </div>
  <select class="year-selector" id="yearSelector"></select>
</div>

<div class="grid grid-4" style="margin-bottom:18px;">
  <div class="card stat-card"><div class="stat-label">Total Income</div><div class="stat-value" id="analytics-total-income">—</div></div>
  <div class="card stat-card"><div class="stat-label">Total Expense</div><div class="stat-value" id="total-expense">—</div></div>
  <div class="card stat-card"><div class="stat-label">Net Savings</div><div class="stat-value" id="net-savings">—</div></div>
  <div class="card stat-card"><div class="stat-label">Best Saving Month</div><div class="stat-value" id="best-saving-month" style="font-size:17px;">—</div></div>
</div>

<div class="grid grid-2" style="margin-bottom:18px;">
  <div class="card chart-card">
    <div class="card-title">Income vs Expense by Month</div>
    <canvas id="incomeExpenseChart" height="160"></canvas>
  </div>
  <div class="card chart-card">
    <div class="card-title">Top 5 Expense Categories</div>
    <canvas id="topCategoriesChart" height="160"></canvas>
  </div>
</div>

<div class="grid grid-2-1" style="margin-bottom:18px;">
  <div class="card chart-card">
    <div class="card-title">Monthly Trend</div>
    <canvas id="monthlyTrendChart" height="140"></canvas>
  </div>
  <div class="card">
    <div class="card-title">Worst Spending Month</div>
    <div class="display" id="worst-month-name" style="font-size:22px; margin-bottom:4px;">—</div>
    <div class="stat-value amount-neg" id="worst-month-amount">—</div>
    <hr class="divider">
    <div class="card-title">Savings Rate</div>
    <div class="stat-value" id="savingsRate">—</div>
  </div>
</div>
</template>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/categories.js"></script>
<script src="js/nav.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
