<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscriptions · Ledgerly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
</head>
<body>
<script>if (!localStorage.getItem('ft_token')) window.location.href = 'login.html';</script>

<template id="tpl">
<div class="page-header">
  <div>
    <div class="page-eyebrow">Obligations</div>
    <h1 class="page-title">Subscription Tracker</h1>
    <p class="page-sub">Every recurring charge, in one place.</p>
  </div>
  <button class="btn btn-brass" id="openSubBtn">+ Add Subscription</button>
</div>

<div class="grid grid-4" style="margin-bottom:20px;">
  <div class="card stat-card"><div class="stat-label">Active</div><div class="stat-value" id="active-count">—</div></div>
  <div class="card stat-card"><div class="stat-label">Monthly Cost</div><div class="stat-value" id="monthly-cost">—</div></div>
  <div class="card stat-card"><div class="stat-label">Yearly Cost</div><div class="stat-value" id="yearly-cost">—</div></div>
  <div class="card stat-card"><div class="stat-label">Health Score</div><div class="stat-value" id="health-score">—</div></div>
</div>

<div class="grid grid-2" style="margin-bottom:20px;">
  <div class="card chart-card"><div class="card-title">Spend by Category</div><canvas id="category-chart" height="160"></canvas></div>
  <div class="card chart-card"><div class="card-title">Monthly Cost Trend</div><canvas id="trend-chart" height="160"></canvas></div>
</div>

<div id="cancelCandidatesCard" class="card" style="margin-bottom:20px; display:none;">
  <div class="card-title">Cancel Candidates</div>
  <div id="cancelCandidatesList" class="faint" style="font-size:13px;"></div>
</div>

<div class="card">
  <div class="filters-row">
    <input type="text" id="subscription-search" placeholder="Search subscriptions…">
    <select id="category-filter"><option value="">All categories</option></select>
    <select id="sort-by"><option value="name">Sort: Name</option><option value="cost">Sort: Cost</option><option value="nextBillingDate">Sort: Next billing</option></select>
  </div>
  <div id="subscription-list"></div>
</div>

<div class="modal-overlay" id="subscription-modal" hidden>
  <div class="modal">
    <div class="modal-header"><h3 id="subModalTitle">Add Subscription</h3><button class="modal-close" id="subModalClose">&times;</button></div>
    <form id="subscription-form">
      <div class="modal-body">
        <input type="hidden" id="subId">
        <div class="form-row"><label for="subName">Name</label><input type="text" id="subName" required placeholder="e.g. Netflix"></div>
        <div class="form-grid">
          <div class="form-row"><label for="subCategory">Category</label>
            <select id="subCategory"><option>Streaming</option><option>Music</option><option>Software</option><option>Fitness</option><option>News</option><option>Cloud Storage</option><option>Other</option></select>
          </div>
          <div class="form-row"><label for="subCost">Cost</label><input type="number" id="subCost" min="0.01" step="0.01" required></div>
        </div>
        <div class="form-grid">
          <div class="form-row"><label for="subCycle">Billing cycle</label>
            <select id="subCycle"><option value="monthly">Monthly</option><option value="yearly">Yearly</option><option value="weekly">Weekly</option></select>
          </div>
          <div class="form-row"><label for="subNextBilling">Next billing date</label><input type="date" id="subNextBilling" required></div>
        </div>
        <div class="form-grid">
          <div class="form-row"><label for="subStartDate">Start date</label><input type="date" id="subStartDate"></div>
          <div class="form-row"><label for="subReminder">Reminder (days before)</label><input type="number" id="subReminder" value="3" min="0"></div>
        </div>
        <div class="form-row"><label for="subPaymentMethod">Payment method</label><input type="text" id="subPaymentMethod" placeholder="e.g. HDFC Credit Card"></div>
        <div class="form-row"><label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="subAutoRenew" checked style="width:auto;"> Auto-renews</label></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="subCancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
</template>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/subscriptions.js"></script>
</body>
</html>
